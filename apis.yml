- aid: saperly:saperly-numbers-api
  name: Saperly Numbers API
  description: >-
    Phone numbers — provision, list, release, and configure the lines in your workspace. Bind a connection
    to a number to make it answer calls and messages, set a per-number webhook, and override the SMS sender
    id or caller ID name. The fleet belongs to the workspace your API key resolves to.
  humanURL: https://saperly.com/docs/api-reference
  baseURL: https://api.saperly.com
