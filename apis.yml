  name: Saperly Messaging API
  description: >-
    Send and list SMS messages on your numbers. Outbound sends are billed per segment and pass through
    opt-out (STOP) and spend-limit enforcement before reaching the carrier; inbound messages are recorded
    against the receiving number.
  humanURL: https://saperly.com/docs/api-reference
  baseURL: https://api.saperly.com
  tags:
