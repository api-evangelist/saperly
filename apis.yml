- aid: saperly:saperly-keys-api
  name: Saperly Keys API
  description: >-
    Provision and manage scoped `sk_` API keys for the workspace. The workspace is always read from the
    calling key, never from client input. A key holding the `keys:admin` scope can mint child keys (and
    list/revoke the workspace's keys), bounded by the parent ceiling: a child's scopes, number allow-list,
    and spend cap must each be a subset of the minting key's own grant.
  humanURL: https://saperly.com/docs/api-reference
  baseURL: https://api.saperly.com
  tags:
  - keys
  properties:
  - type: OpenAPI
    url: openapi/saperly-keys-api-openapi.yml
  - type: Documentation
    url: https://saperly.com/docs/api-reference
  - type: APIReference
    url: https://api.saperly.com/reference
- aid: saperly:saperly-languages-api
  name: Saperly Languages API
  description: >-
    Discover the spoken languages a connection can use (its `language` field). The list is derived from
    the voice catalogue — every language here has at least one voice that speaks it (see `GET /voices`)
    — and is ordered most-supported first. Any well-formed BCP-47 tag is also accepted on a connection;
    this is the curated, recommended set.
  humanURL: https://saperly.com/docs/api-reference
  baseURL: https://api.saperly.com
  tags:
  - languages
  properties:
  - type: OpenAPI
