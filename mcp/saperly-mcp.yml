description: Saperly operates a remote MCP server at https://api.saperly.com/mcp (Streamable HTTP, JSON-RPC 2.0)
  authenticated with a scoped sap_sk_ bearer key or an MCP OAuth 2.1 access token issued by https://saperly.com.
  Tools are discovered at connect time via tools/list and filtered per caller by scope. A local stdio server also
  ships as npx -y @saperly/mcp with a 32-tool manifest.
server:
  url: https://api.saperly.com/mcp
  transport: streamable-http
  protocol: JSON-RPC 2.0
  auth: 'Authorization: Bearer <sap_sk_ key> or MCP OAuth access token'
  docs: https://saperly.com/docs/sdks/mcp
deployment:
  mode: both
  endpoint: https://api.saperly.com/mcp
  install: npx -y @saperly/mcp
  package: https://www.npmjs.com/package/@saperly/mcp
  auth: oauth
  verified: probed
  note: 'Remote endpoint probed 2026-10-07: POST tools/list returned 401 with WWW-Authenticate: Bearer error="invalid_token",
    resource_metadata="https://api.saperly.com/.well-known/oauth-protected-resource". The stdio package is on npm
    (0.3.0, 2026-05-14) and documented in the repo README; a legacy hosted URL the README names, https://saperly.com/api/v1/mcp,
    answered 404 (GET) and 500 "Only HTML requests are supported here" (POST) and is not live.'
