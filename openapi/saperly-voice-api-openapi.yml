components:
  schemas:
    UpstreamError:
      type: object
      properties:
        _tag:
          type: string
          enum:
          - UpstreamError
        status:
          type: number
          allOf:
          - description: The HTTP status the carrier returned upstream.
        code:
          type: string
          description: A short machine-readable code for the upstream failure.
        message:
          type: string
          description: A human-readable description of the upstream failure (carrier identity scrubbed).
      required:
      - _tag
      - status
      - code
      - message
      additionalProperties: false
    UnsupportedVoice:
      type: object
      properties:
        _tag:
          type: string
          enum:
          - UnsupportedVoice
        field:
          type: string
        voice:
          type: string
        message:
          type: string
      required:
      - _tag
      - field
      - voice
      - message
      additionalProperties: false
    RateLimited:
      type: object
      properties:
        _tag:
          type: string
          enum:
          - RateLimited
        bucket:
          type: string
          description: The rate-limit bucket that was exhausted.
      required:
      - _tag
      - bucket
      additionalProperties: false
    CallNotFound:
      type: object
      properties:
        _tag:
          type: string
          enum:
          - CallNotFound
        callId:
          type: string
      required:
      - _tag
      - callId
      additionalProperties: false
    NumberHasNoConnection:
      type: object
      properties:
        _tag:
          type: string
          enum:
          - NumberHasNoConnection
        numberId:
          type: string
      required:
      - _tag
      - numberId
      additionalProperties: false
    Unauthorized:
      type: object
      properties:
        _tag:
          type: string
          enum:
          - Unauthorized
        message:
          type: string
          description: Why the request was rejected (missing, invalid, or insufficient credentials).
      required:
      - _tag
      - message
      additionalProperties: false
    AudioConfigurationError:
      type: object
      properties:
        _tag:
          type: string
          enum:
          - AudioConfigurationError
        message:
          type: string
      required:
      - _tag
      - message
      additionalProperties: false
    IdempotencyConflict:
      type: object
      properties:
        _tag:
          type: string
          enum:
          - IdempotencyConflict
        message:
          type: string
          description: Details of the conflict — a concurrent request is still processing under the same `Idempotency-Key`.
      required:
      - _tag
      - message
      additionalProperties: false
    RecipientOptedOut:
      type: object
      properties:
        _tag:
          type: string
          enum:
          - RecipientOptedOut
        to:
          type: string
      required:
      - _tag
      - to
      additionalProperties: false
    SpendLimitExceeded:
      type: object
      properties:
        _tag:
          type: string
          enum:
          - SpendLimitExceeded
        limitCents:
          type: number
        priorSpendCents:
          type: number
        requestedCents:
          type: number
      required:
      - _tag
      - limitCents
      - priorSpendCents
      - requestedCents
      additionalProperties: false
    InsufficientFunds:
      type: object
      properties:
        _tag:
          type: string
          enum:
          - InsufficientFunds
        balanceCents:
          type: number
        requestedCents:
          type: number
      required:
      - _tag
      - balanceCents
      - requestedCents
      additionalProperties: false
    InternalError:
      type: object
      properties:
        _tag:
          type: string
          enum:
          - InternalError
        traceId:
          type: string
          description: A correlation id for this failure — quote it when reporting the problem so the request can be traced.
      required:
      - _tag
      - traceId
      additionalProperties: false
    CallStartFailed:
      type: object
      properties:
        _tag:
          type: string
          enum:
          - CallStartFailed
        reason:
          type: string
      required:
      - _tag
      - reason
      additionalProperties: false
    AuthorizationDenied:
      type: object
      properties:
        _tag:
          type: string
          enum:
          - AuthorizationDenied
        reason:
          type: string
      required:
      - _tag
      - reason
      additionalProperties: false
    NumberNotFound:
      type: object
      properties:
        _tag:
          type: string
          enum:
          - NumberNotFound
        numberId:
          type: string
      required:
      - _tag
      - numberId
      additionalProperties: false
    IdempotencyKeyMismatch:
      type: object
      properties:
        _tag:
          type: string
          enum:
          - IdempotencyKeyMismatch
        message:
          type: string
          description: Why the `Idempotency-Key` is unprocessable — either malformed (e.g. over the length cap) or reused for a request with a different payload.
      required:
      - _tag
      - message
      additionalProperties: false
