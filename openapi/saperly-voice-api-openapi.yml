                  hasTranscript:
                    type: boolean
                  createdAt:
                    type: string
                required:
                - id
                - numberId
                - direction
                - to
                - from
                - status
                - rateCentsPerMin
                - durationSec
                - costCents
                - hasRecording
                - hasTranscript
                - createdAt
                additionalProperties: false
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: AuthorizationDenied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationDenied'
        '404':
          description: CallNotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallNotFound'
        '429':
          description: RateLimited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimited'
        '500':
          description: InternalError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
      summary: End a live call
    servers:
    - url: /
      description: This worker
