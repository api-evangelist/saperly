openapi: 3.2.0
info:
  title: Saperly Voice API
  version: 0.1.0
  description: 'Operations tagged voice across 2 of this provider''s published API definitions: api-saperly-com-openapi.json, saperly-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /
  description: This worker
- url: https://api.saperly.com
  description: Production
security: []
tags:
- name: Voice
  description: Place and control outbound calls and fetch call records. Audio always stays in-network — there is no live media-control surface here by design. Funds are reserved on start and settled from the carrier-reported duration on end.
paths:
  /calls:
    post:
      tags:
      - Voice
      operationId: voice.place
      parameters: []
      security: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  numberId:
                    type: string
                  direction:
                    type: string
                    enum:
                    - inbound
                    - outbound
                  to:
                    type: string
                  from:
                    type: string
                  status:
                    type: string
                    description: Lifecycle status. `initiated` (placed or ringing, not yet finalized), `completed` (connected and hung up; billed by duration), `no_answer` (the callee never picked up; zero cost), `failed` (the carrier could not connect it, or it was expired unfinalized; zero cost), `rejected` (refused before answer — insufficient balance; zero cost). Only `completed` bills.
                  rateCentsPerMin:
                    anyOf:
                    - type: number
                    - type: 'null'
                  durationSec:
                    anyOf:
                    - type: number
                    - type: 'null'
                  costCents:
                    anyOf:
                    - type: number
                    - type: 'null'
                  hasRecording:
                    type: boolean
                  hasTranscript:
                    type: boolean
                  createdAt:
                    type: string
                required:
                - id
                - numberId
                - direction
                - to
                - from
                - status
                - rateCentsPerMin
                - durationSec
                - costCents
                - hasRecording
                - hasTranscript
                - createdAt
                additionalProperties: false
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '402':
          description: InsufficientFunds | SpendLimitExceeded
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/InsufficientFunds'
                - $ref: '#/components/schemas/SpendLimitExceeded'
        '403':
          description: AuthorizationDenied | RecipientOptedOut
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AuthorizationDenied'
                - $ref: '#/components/schemas/RecipientOptedOut'
        '404':
          description: NumberNotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumberNotFound'
        '409':
          description: IdempotencyConflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdempotencyConflict'
        '422':
          description: NumberHasNoConnection | AudioConfigurationError | UnsupportedVoice | IdempotencyKeyMismatch
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/NumberHasNoConnection'
                - $ref: '#/components/schemas/AudioConfigurationError'
                - $ref: '#/components/schemas/UnsupportedVoice'
                - $ref: '#/components/schemas/IdempotencyKeyMismatch'
        '429':
          description: RateLimited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimited'
        '500':
          description: InternalError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
        '502':
          description: CallStartFailed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallStartFailed'
      summary: Place an outbound call
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fromNumberId:
                  type: string
                  description: The Saperly number id to place the call from.
                to:
                  type: string
                  description: The destination in E.164 format, e.g. "+15555550123".
                connectionId:
                  anyOf:
                  - type: string
                    description: Optional. Use this connection for the call instead of the number's bound one.
                  - type: 'null'
                instructions:
                  anyOf:
                  - type: string
                    description: A per-call system prompt that overrides the connection's saved instructions for this call only. Omit to run the call on the line's saved config. (Voice/model/language are not per-call overridable via the API — set them on the connection.)
                  - type: 'null'
              required:
              - fromNumberId
              - to
              additionalProperties: false
              description: Place an outbound call from a Saperly number. The connection bound to the number (or `connectionId`) is the brain; audio stays in-network.
        required: true
    get:
      tags:
      - Voice
      operationId: voice.list
      parameters: []
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    numberId:
                      type: string
                    direction:
                      type: string
                      enum:
                      - inbound
                      - outbound
                    to:
                      type: string
                    from:
                      type: string
                    status:
                      type: string
                      description: Lifecycle status. `initiated` (placed or ringing, not yet finalized), `completed` (connected and hung up; billed by duration), `no_answer` (the callee never picked up; zero cost), `failed` (the carrier could not connect it, or it was expired unfinalized; zero cost), `rejected` (refused before answer — insufficient balance; zero cost). Only `completed` bills.
                    rateCentsPerMin:
                      anyOf:
                      - type: number
                      - type: 'null'
                    durationSec:
                      anyOf:
                      - type: number
                      - type: 'null'
                    costCents:
                      anyOf:
                      - type: number
                      - type: 'null'
                    hasRecording:
                      type: boolean
                    hasTranscript:
                      type: boolean
                    createdAt:
                      type: string
                  required:
                  - id
                  - numberId
                  - direction
                  - to
                  - from
                  - status
                  - rateCentsPerMin
                  - durationSec
                  - costCents
                  - hasRecording
                  - hasTranscript
                  - createdAt
                  additionalProperties: false
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: AuthorizationDenied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationDenied'
        '429':
          description: RateLimited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimited'
        '500':
          description: InternalError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
      summary: List calls
    servers:
    - url: /
      description: This worker
