        required: true
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  mode:
                    type: string
                    enum:
                    - hosted
                    - manual
                  instructions:
                    type: string
                  llm:
                    anyOf:
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                          - managed
                        model:
                          type: string
                      required:
                      - kind
                      - model
                      additionalProperties: false
                    - type: 'null'
                  backgroundAudio:
                    anyOf:
                    - anyOf:
                      - type: object
                        properties:
                          type:
                            type: string
                            enum:
                            - 'off'
                        required:
                        - type
                        additionalProperties: false
                      - type: object
                        properties:
                          type:
                            type: string
                            enum:
                            - office
                          volume:
                            anyOf:
                            - anyOf:
                              - type: number
                              - type: string
                                enum:
                                - NaN
                              - type: string
                                enum:
                                - Infinity
                              - type: string
                                enum:
                                - -Infinity
                            - type: string
                              enum:
                              - Infinity
                              - -Infinity
                              - NaN
                        required:
                        - type
                        - volume
                        additionalProperties: false
                    - type: 'null'
                  language:
                    anyOf:
                    - type: string
                    - type: 'null'
                  mcpServers:
                    anyOf:
                    - type: array
                      items:
                        type: object
                        properties:
                          url:
                            type: string
                          auth:
                            anyOf:
                            - type: object
                              properties:
                                type:
                                  type: string
                                  enum:
                                  - bearer
                                  - none
                                token:
                                  anyOf:
                                  - type: string
                                  - type: 'null'
                              required:
                              - type
                              additionalProperties: false
                            - type: 'null'
                          allowedTools:
                            anyOf:
                            - type: array
                              items:
                                type: string
                            - type: 'null'
                        required:
                        - url
                        additionalProperties: false
                    - type: 'null'
                  callControl:
                    anyOf:
                    - type: object
                      properties:
                        endCall:
                          anyOf:
                          - type: boolean
                          - type: 'null'
                        sendDtmf:
                          anyOf:
                          - type: boolean
                          - type: 'null'
                        transfer:
                          anyOf:
                          - type: object
                            properties:
                              targets:
                                type: array
                                items:
                                  type: string
                              from:
                                anyOf:
                                - type: string
                                - type: 'null'
                            required:
                            - targets
                            additionalProperties: false
                          - type: 'null'
                      additionalProperties: false
                    - type: 'null'
                  complianceEnabled:
                    type: boolean
                  smsAutoReply:
                    type: boolean
                  disclosure:
                    type: string
                  recordingEnabled:
                    type: boolean
                  openaiRealtime:
                    anyOf:
                    - type: object
                      properties:
                        model:
                          type: string
                        voice:
                          anyOf:
                          - type: string
                          - type: 'null'
                      required:
                      - model
                      additionalProperties: false
                    - type: 'null'
                  manualSecret:
                    anyOf:
                    - type: string
                    - type: 'null'
                  manualWebhookUrl:
                    anyOf:
                    - type: string
                    - type: 'null'
                  createdAt:
                    type: string
                  backend:
                    type: string
                    enum:
                    - network
                    - openai_realtime
                  tts:
                    anyOf:
                    - type: object
                      properties:
                        voiceId:
                          type: string
                      required:
                      - voiceId
                      additionalProperties: false
                    - type: 'null'
                required:
                - id
                - name
                - mode
                - instructions
                - llm
                - language
                - mcpServers
                - callControl
                - complianceEnabled
                - smsAutoReply
                - disclosure
                - recordingEnabled
                - openaiRealtime
                - manualSecret
                - manualWebhookUrl
                - createdAt
                - backend
                - tts
                additionalProperties: false
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: AuthorizationDenied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationDenied'
        '404':
          description: ConnectionNotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionNotFound'
        '429':
          description: RateLimited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimited'
        '500':
          description: InternalError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
      summary: Get a connection by id
    patch:
      tags:
      - Connections
      operationId: connections.update
      parameters:
      - name: id
        in: path
        schema:
          type: string
          description: The connection's id.
        required: true
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  mode:
                    type: string
                    enum:
                    - hosted
                    - manual
                  instructions:
                    type: string
                  llm:
                    anyOf:
                    - type: object
                      properties:
                        kind:
                          type: string
