openapi: 3.2.0
info:
  title: Saperly Numbers API
  version: 0.1.0
  description: 'Operations tagged numbers across 2 of this provider''s published API definitions: api-saperly-com-openapi.json, saperly-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /
  description: This worker
- url: https://api.saperly.com
  description: Production
security: []
tags:
- name: Numbers
  description: Phone numbers — provision, list, release, and configure the lines in your workspace. Bind a connection to a number to make it answer calls and messages, set a per-number webhook, and override the SMS sender id or caller ID name. The fleet belongs to the workspace your API key resolves to.
paths:
  /numbers:
    get:
      tags:
      - Numbers
      operationId: numbers.list
      parameters: []
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    phoneNumber:
                      type: string
                    connectionId:
                      anyOf:
                      - type: string
                      - type: 'null'
                    webhookUrl:
                      anyOf:
                      - type: string
                      - type: 'null'
                    smsSenderId:
                      anyOf:
                      - type: string
                      - type: 'null'
                    callerIdName:
                      anyOf:
                      - type: string
                      - type: 'null'
                    country:
                      anyOf:
                      - type: string
                      - type: 'null'
                    numberType:
                      anyOf:
                      - type: string
                      - type: 'null'
                    monthlyPriceCents:
                      anyOf:
                      - type: number
                      - type: 'null'
                    currency:
                      anyOf:
                      - type: string
                      - type: 'null'
                    nextChargeAt:
                      anyOf:
                      - type: string
                      - type: 'null'
                    releasedAt:
                      anyOf:
                      - type: string
                      - type: 'null'
                    createdAt:
                      type: string
                  required:
                  - id
                  - phoneNumber
                  - connectionId
                  - webhookUrl
                  - country
                  - numberType
                  - monthlyPriceCents
                  - currency
                  - nextChargeAt
                  - releasedAt
                  - createdAt
                  additionalProperties: false
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: AuthorizationDenied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationDenied'
        '429':
          description: RateLimited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimited'
        '500':
          description: InternalError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
      summary: List all phone numbers in the workspace
    post:
      tags:
      - Numbers
      operationId: numbers.provision
      parameters: []
      security: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  phoneNumber:
                    type: string
                  connectionId:
                    anyOf:
                    - type: string
                    - type: 'null'
                  webhookUrl:
                    anyOf:
                    - type: string
                    - type: 'null'
                  smsSenderId:
                    anyOf:
                    - type: string
                    - type: 'null'
                  callerIdName:
                    anyOf:
                    - type: string
                    - type: 'null'
                  country:
                    anyOf:
                    - type: string
                    - type: 'null'
                  numberType:
                    anyOf:
                    - type: string
                    - type: 'null'
                  monthlyPriceCents:
                    anyOf:
                    - type: number
                    - type: 'null'
                  currency:
                    anyOf:
                    - type: string
                    - type: 'null'
                  nextChargeAt:
                    anyOf:
                    - type: string
                    - type: 'null'
                  releasedAt:
                    anyOf:
                    - type: string
                    - type: 'null'
                  createdAt:
                    type: string
                required:
                - id
                - phoneNumber
                - connectionId
                - webhookUrl
                - country
                - numberType
                - monthlyPriceCents
                - currency
                - nextChargeAt
                - releasedAt
                - createdAt
                additionalProperties: false
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '402':
          description: InsufficientFunds | PaymentMethodRequired
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/InsufficientFunds'
                - $ref: '#/components/schemas/PaymentMethodRequired'
        '403':
          description: AuthorizationDenied | CountryNotAvailable
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AuthorizationDenied'
                - $ref: '#/components/schemas/CountryNotAvailable'
        '404':
          description: NoNumbersAvailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoNumbersAvailable'
        '409':
          description: NumberQuotaExceeded | PriceChanged | IdempotencyConflict
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/NumberQuotaExceeded'
                - $ref: '#/components/schemas/PriceChanged'
                - $ref: '#/components/schemas/IdempotencyConflict'
        '422':
          description: IdempotencyKeyMismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdempotencyKeyMismatch'
        '429':
          description: RateLimited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimited'
        '500':
          description: InternalError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
        '502':
          description: UpstreamError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpstreamError'
      summary: Provision a phone number
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                country:
                  anyOf:
                  - type: string
                    description: ISO 3166-1 alpha-2 country code to provision a number in (e.g. `US`, `GB`). Defaults to `US`.
                  - type: 'null'
                numberType:
                  anyOf:
                  - type: string
                    description: The kind of number to provision (e.g. `local`, `toll_free`, `mobile`, `national`). Defaults to `local`.
                  - type: 'null'
                areaCode:
                  anyOf:
                  - type: string
                    description: Preferred area code / city prefix to search within the country (e.g. `415`). Omit to take any available number.
                  - type: 'null'
                expectedMonthlyPriceCents:
                  anyOf:
                  - type: number
                    allOf:
                    - description: 'The monthly price (in cents) you quoted to the customer. If the live order price exceeds it, provision fails with `PriceChanged` instead of charging — resubmit with `approveHigherPrice: true` to accept the higher price.'
                  - type: 'null'
                expectedUpfrontPriceCents:
                  anyOf:
                  - type: number
                    allOf:
                    - description: 'The one-time upfront price (in cents) you quoted to the customer. If the live order price exceeds it, provision fails with `PriceChanged` instead of charging — resubmit with `approveHigherPrice: true` to accept the higher price.'
                  - type: 'null'
                approveHigherPrice:
                  anyOf:
                  - type: boolean
                    description: Set true to accept a live order price higher than the `expected*` values you quoted, instead of failing with `PriceChanged`.
                  - type: 'null'
              additionalProperties: false
        required: true
    servers:
    - url: /
      description: This worker
  /numbers/{id}:
    get:
      tags:
