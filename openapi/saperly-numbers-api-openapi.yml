                required:
                - id
                - phoneNumber
                - connectionId
                - webhookUrl
                - country
                - numberType
                - monthlyPriceCents
                - currency
                - nextChargeAt
                - releasedAt
                - createdAt
                additionalProperties: false
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: AuthorizationDenied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationDenied'
        '404':
          description: NumberNotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumberNotFound'
        '429':
          description: RateLimited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimited'
        '500':
          description: InternalError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
      summary: Get a phone number by id
    servers:
    - url: /
      description: This worker
